---
- name: Deploy Custom Apache Web Servers on Port 8080
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache2 package
      apt:
        name: apache2
        state: present

    - name: Configure Apache to listen on port 8080
      lineinfile:
        path: /etc/apache2/ports.conf
        regexp: '^Listen 80$'
        line: 'Listen 8080'
      notify: Restart Apache

    - name: Update default virtualhost to use port 8080
      lineinfile:
        path: /etc/apache2/sites-available/000-default.conf
        regexp: '<VirtualHost \*:80>'
        line: '<VirtualHost *:8080>'
      notify: Restart Apache

    - name: Write custom dynamic SJSU index page
      copy:
        dest: /var/www/html/index.html
        content: "Hello World from SJSU-{{ instance_id }}\n"
        mode: '0644'

    - name: Ensure Apache is started and enabled on boot
      service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
